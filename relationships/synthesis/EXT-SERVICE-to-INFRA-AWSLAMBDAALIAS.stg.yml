relationships:
  # EXISTING (production): manual override via newrelic.aws_metric_streams.arn — kept unchanged.
  - name: extServiceCallsAwsLambdaAlias_Explicit
    version: "1"
    origins:
      - Distributed Tracing
      - OpenTelemetry
    conditions:
      - attribute: eventType
        anyOf: [ "Log", "Span" ]
      - attribute: newrelic.source
        anyOf: [ "api.logs.otlp", "api.traces.otlp" ]
      - attribute: entity.type
        anyOf: [ "SERVICE" ]
      - attribute: newrelic.aws_metric_streams.arn
        regex: "^arn:aws:lambda:([^:]*):([^:]*):function:([^:]*):([^/]*)$"
    relationship:
      expires: PT75M
      relationshipType: CALLS
      source:
        extractGuid:
          attribute: entity.guid
      target:
        lookupGuid:
          candidateCategory: AWSLAMBDAALIAS
          fields:
            - field: awsLambdaAliasArn
              attribute: newrelic.aws_metric_streams.arn

  # NEW (staging) — native, Go (aws.lambda.invoked_arn): preferred native attribute.
  - name: extServiceCallsAwsLambdaAlias_InvokedArn
    version: "1"
    origins:
      - Distributed Tracing
      - OpenTelemetry
    conditions:
      - attribute: eventType
        anyOf: [ "Log", "Span" ]
      - attribute: newrelic.source
        anyOf: [ "api.logs.otlp", "api.traces.otlp" ]
      - attribute: entity.type
        anyOf: [ "SERVICE" ]
      - attribute: aws.lambda.invoked_arn
        regex: "^arn:aws:lambda:([^:]*):([^:]*):function:([^:]*):([^/]*)$"
      - attribute: newrelic.aws_metric_streams.arn
        present: false
    relationship:
      expires: PT75M
      relationshipType: CALLS
      source:
        extractGuid:
          attribute: entity.guid
      target:
        lookupGuid:
          candidateCategory: AWSLAMBDAALIAS
          fields:
            - field: awsLambdaAliasArn
              attribute: aws.lambda.invoked_arn

  # NEW (staging) — native, Python/Java/JS (cloud.resource_id).
  - name: extServiceCallsAwsLambdaAlias_CloudResourceId
    version: "1"
    origins:
      - Distributed Tracing
      - OpenTelemetry
    conditions:
      - attribute: eventType
        anyOf: [ "Log", "Span" ]
      - attribute: newrelic.source
        anyOf: [ "api.logs.otlp", "api.traces.otlp" ]
      - attribute: entity.type
        anyOf: [ "SERVICE" ]
      - attribute: cloud.resource_id
        regex: "^arn:aws:lambda:([^:]*):([^:]*):function:([^:]*):([^/]*)$"
      - attribute: aws.lambda.invoked_arn
        present: false
      - attribute: newrelic.aws_metric_streams.arn
        present: false
    relationship:
      expires: PT75M
      relationshipType: CALLS
      source:
        extractGuid:
          attribute: entity.guid
      target:
        lookupGuid:
          candidateCategory: AWSLAMBDAALIAS
          fields:
            - field: awsLambdaAliasArn
              attribute: cloud.resource_id

  # NEW (staging) — native, .NET/legacy (faas.id): permanent.
  - name: extServiceCallsAwsLambdaAlias_FaasId
    version: "1"
